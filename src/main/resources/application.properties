# ==========================================
# Comercializadora Leon - Sistema de Inventario
# ==========================================

# --- Servidor ---
server.port=8080

# HTTPS: la contrasena y el token viajan cifrados por el Wi-Fi. El certificado lo genera
# mkcert para la IP del PC (ver "HTTPS" en CLAUDE.md) y vive en config/, ignorado por git.
# Si cambia la IP del PC hay que generar el certificado de nuevo.
server.ssl.enabled=true
server.ssl.certificate=file:./config/cleon-cert.pem
server.ssl.certificate-private-key=file:./config/cleon-key.pem
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2

# Limites de tamano contra peticiones abusivas. El cuerpo JSON se limita aparte
# (ver "JSON estricto" mas abajo y Security/TamanoPeticionFilter).
server.max-http-request-header-size=16KB
server.tomcat.max-http-form-post-size=64KB
server.tomcat.max-swallow-size=64KB

# Nunca enviar al cliente mensajes internos ni trazas de error.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# --- Secretos ---
# Las contrasenas NO van en este archivo (esta versionado en git). Se leen de
# config/secretos.properties, que git ignora. Plantilla: config/secretos.example.properties.
# Tambien se pueden pasar como variables de entorno con el mismo nombre.
spring.config.import=optional:file:./config/secretos.properties

# --- Seguridad ---
# Paginas que pueden llamar a la API (expresion exacta). En el PC: Live Server por HTTPS
# desde cualquier equipo de la red 192.168.x.x. En produccion lo reemplaza
# application-prod.properties.
cleon.cors.origenes=^https://(localhost|127\\.0\\.0\\.1|192\\.168\\.\\d{1,3}\\.\\d{1,3}):5500$

# Spring Boot crea por defecto un usuario "user" en memoria con una contrasena que
# imprime en el log. Aqui los unicos usuarios son los de la tabla usuarios.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# --- Conexion a PostgreSQL ---
# El backend se conecta con cleon_app, un rol sin privilegios de dueno ni de superusuario
# (lo crea db/seguridad.sql). No puede cambiar la estructura de las tablas ni saltarse
# la seguridad por filas (RLS).
spring.datasource.url=jdbc:postgresql://localhost:5432/cleon
spring.datasource.username=cleon_app
spring.datasource.password=${CLEON_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# validate: Hibernate solo comprueba que las entidades coincidan con las tablas y nunca
# las modifica, porque cleon_app no tiene permiso para hacerlo. Los cambios de estructura
# se hacen con scripts en db/ ejecutados como postgres.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- JSON estricto ---
# Rechaza campos desconocidos, claves duplicadas, decimales donde van enteros y basura
# despues del JSON, y pone topes de tamano al documento (tambien si llega sin Content-Length).
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.jackson.deserialization.fail-on-null-for-primitives=true
spring.jackson.read.strict-duplicate-detection=true
spring.jackson.factory.constraints.read.max-document-length=65536
spring.jackson.factory.constraints.read.max-nesting-depth=16
spring.jackson.factory.constraints.read.max-string-length=5000
spring.jackson.factory.constraints.read.max-number-length=30
spring.jackson.factory.constraints.read.max-name-length=100

# --- Zona horaria para fechas ---
spring.jackson.time-zone=America/Bogota
