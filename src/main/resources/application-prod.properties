# ==========================================
# Produccion (Render)
# ==========================================
# Se activa con SPRING_PROFILES_ACTIVE=prod (ya viene en el Dockerfile) y reemplaza
# lo que cambia respecto a application.properties. Los valores con ${...} son variables
# de entorno que se configuran en el panel de Render (ver DESPLIEGUE.md).

# Render pone el HTTPS con un certificado publico y le reenvia las peticiones al
# contenedor por HTTP, en el puerto que indica la variable PORT.
server.port=${PORT:8080}
server.ssl.enabled=false

# La IP real del visitante llega en la cabecera X-Forwarded-For que agrega el proxy de
# Render. "native" hace que Tomcat solo la acepte si la peticion viene de una red interna
# (el proxy): desde afuera nadie puede inventarla para saltarse el limite por IP.
server.forward-headers-strategy=native

# Base de datos en Neon. Ejemplo de CLEON_DB_URL:
#   jdbc:postgresql://ep-xxxx.sa-east-1.aws.neon.tech/cleon?sslmode=require
# sslmode=require: la conexion con la base viaja cifrada.
spring.datasource.url=${CLEON_DB_URL}

# Direccion del frontend en Cloudflare Pages, como expresion regular exacta.
# Ejemplo de CLEON_CORS_ORIGENES:  ^https://cleon\.pages\.dev$
cleon.cors.origenes=${CLEON_CORS_ORIGENES}

# Sin SQL en el log de produccion.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
